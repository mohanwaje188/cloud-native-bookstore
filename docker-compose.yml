services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/bookstore
      JWT_SECRET: change-me
    depends_on: [mongo]
  frontend:
    build: ./frontend
    ports: ["8081:80"]
    depends_on: [backend]
volumes:
  mongo-data:
